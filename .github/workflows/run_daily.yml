name: Daily Stock Data Collection

on:
  schedule:
    # 한국 시간 21시 (21 - 9 = UTC 12시)
    - cron: '0 12 * * *'
  # 수동 실행 버튼 활성화
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 최신 Node.js 24와 호환되는 버전으로 업그레이드
    - name: Checkout code
      uses: actions/checkout@v5

    # 2. 파이썬 설정 액션도 최신 호환 버전으로 업그레이드
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Stock Collection Script
      run: python collect_stock.py
